########################################################################
# Подключения файлов
########################################################################

[include ALP/voron/voron_b/macros/Demon_Klipper_Essentials_Unified/*.cfg]
[include ALP/voron/voron_b/macros/Demon_User_Files/*.cfg]
[include ALP/voron/voron_b/macros/KAMP_LiTE/*.cfg]
[include ALP/voron/voron_b/macros/*.cfg]
[include ALP/voron/voron_b/hardware/*.cfg]

[include mainsail.cfg]
[include My_Macros.cfg]


#####################################################################
##	          Индивидуальные значения параметров
#####################################################################

[mcu]
canbus_uuid: 8360a7c0bc7c

[mcu EBBCan]
canbus_uuid: 201283eadaa8

#####################################################################
##	                 Калибровочные значения
#####################################################################

# 1. Калибровка ПИД экструдера
[extruder]
pid_Kp: 25.986
pid_Ki: 1.952
pid_Kd: 86.623

# 2. Калибровка ПИД стола
[heater_bed]
pid_Kp: 69.054
pid_Ki: 3.682
pid_Kd: 323.861

# 3. Калибровка разрешения экструдера https://www.klipper3d.org/Rotation_Distance.html
[extruder]
rotation_distance: 22.136

# 4. z-offset (Voron Tap)
[probe]
z_offset: -0.63

# 5. Input Shaper
[input_shaper]
shaper_freq_x: 58.4
shaper_type_x: mzv
shaper_freq_y: 49.4
shaper_type_y: mzv

[printer]
max_accel: 5000

