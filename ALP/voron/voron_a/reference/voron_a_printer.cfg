########################################################################
# Подключения файлов
########################################################################

[include ALP/voron/voron_a/macros/Demon_Klipper_Essentials_Unified/*.cfg]
[include ALP/voron/voron_a/macros/Demon_User_Files/*.cfg]
[include ALP/voron/voron_a/macros/KAMP_LiTE/*.cfg]
[include ALP/voron/voron_a/macros/*.cfg]
[include ALP/voron/voron_a/hardware/*.cfg]

[include mainsail.cfg]
[include My_Macros.cfg]


#####################################################################
##	          Индивидуальные значения параметров
#####################################################################

[mcu]
canbus_uuid: 2e5dd68142bb

[mcu EBBCan]
canbus_uuid: c7ec876885e9

#####################################################################
##	                 Калибровочные значения
#####################################################################

# 1. Калибровка ПИД экструдера
[extruder]
pid_Kp: 26.075
pid_Ki: 2.094
pid_Kd: 81.160

# 2. Калибровка ПИД стола
[heater_bed]
pid_Kp: 38.891
pid_Ki: 0.803
pid_Kd: 471.072

# 3. Калибровка разрешения экструдера https://www.klipper3d.org/Rotation_Distance.html
[extruder]
rotation_distance: 12.837

# 4. z-offset (Voron Tap)
[probe]
z_offset: -0.315

# 5. Input Shaper
[input_shaper]
shaper_freq_x: 57.0
shaper_type_x: mzv
shaper_freq_y: 42.2
shaper_type_y: mzv

[printer]
max_accel: 5000

