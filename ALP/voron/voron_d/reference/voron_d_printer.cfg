########################################################################
# Подключения файлов
########################################################################

[include ALP/voron/voron_d/macros/Demon_Klipper_Essentials_Unified/*.cfg]
[include ALP/voron/voron_d/macros/Demon_User_Files/*.cfg]
[include ALP/voron/voron_d/macros/KAMP_LiTE/*.cfg]
[include ALP/voron/voron_d/macros/*.cfg]
[include ALP/voron/voron_d/hardware/*.cfg]

[include mainsail.cfg]
[include My_Macros.cfg]


#####################################################################
##	          Индивидуальные значения параметров
#####################################################################

[mcu]
canbus_uuid: 1a16707ceea9

[mcu EBBCan]
canbus_uuid: a079fab47dce

#####################################################################
##	                 Калибровочные значения
#####################################################################

# 1. Калибровка ПИД экструдера
[extruder]
pid_Kp: 25.186
pid_Ki: 1.952
pid_Kd: 81.223

# 2. Калибровка ПИД стола
[heater_bed]
pid_Kp: 67.054
pid_Ki: 3.492
pid_Kd: 321.861

# 3. Калибровка разрешения экструдера https://www.klipper3d.org/Rotation_Distance.html
##	When performing extruder calibration, update the following values
##	Let's say you ask for a 100mm feed, but it's actually 98mm ,
##	New value = old value x (actual extrusion length / target length)
[extruder]
rotation_distance : 22.136

# 4. z-offset
[probe]
# z_offset: 3.405 в минус - дальше от стола
z_offset: -0.39

[input_shaper]
shaper_freq_x: 58.4
shaper_type_x: mzv
shaper_freq_y: 41.4
shaper_type_y: mzv

[printer]
max_accel: 5000

