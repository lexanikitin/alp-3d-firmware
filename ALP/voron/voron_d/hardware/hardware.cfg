# ======================================================================
#                          ОГЛАВЛЕНИЕ
# ======================================================================
# I.   ОБЩИЕ НАСТРОЙКИ И КОММЕНТАРИИ
# II.  ШАГОВЫЕ ДВИГАТЕЛИ (X, Y, Z, E)
# III. НАГРЕВАТЕЛИ (Экструдер, Стол)
# IV.  ДАТЧИКИ ТЕМПЕРАТУРЫ
# V.   ВЕНТИЛЯТОРЫ (Обдув, радиатор, плата)
# VI.  КОНТРОЛЛЕРЫ (MCU, хосты, ADXL)
# VII. ИНТЕРФЕЙСЫ И ЭКРАНЫ (LCD, LED, пины)

# IX.  КАЛИБРОВКА (Probe, Mesh, Screws)
# X.   СКОРОСТИ И УСКОРЕНИЯ [printer]
# XI.  МАКРОСЫ (переопределения, START, END)
# ======================================================================

#####################################################################
## 	                MCU
#####################################################################

[mcu host]
serial : /tmp/klipper_host_mcu

[mcu]
canbus_interface : can0

[mcu EBBCan]

#####################################################################
##	                 Temperature Monitoring
#####################################################################

[temperature_sensor EBB_NTC]
sensor_type : Generic 3950
sensor_pin : EBBCan:gpio28

#[temperature_sensor Octopus_Pro]
#sensor_type : temperature_mcu

#[temperature_sensor BTT-PI]
#sensor_type : temperature_host

#####################################################################
#   B(X) ---------A(Y)
#   |                |
#   |--------E-------|
#   |                |
#   |                |
#   |                |
#####################################################################
##                   X-axis on MOTOR_0(B Motor)
#####################################################################

[stepper_x]
step_pin : PF13             # X-axis motor pulse pin setting
dir_pin : !PF12              # X-axis motor direction pin setting
enable_pin : !PF14          # X-axis motor enable pin setting
microsteps : 32             # Motor microsteps Setting
rotation_distance : 40      # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
full_steps_per_rotation : 200   # Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)
endstop_pin : EBBCan:gpio24 #PG6           # Limit switch PIN pin setting（X-）
position_min : 0            # X-axis minimum travel - software limit
position_endstop : 350    ## Mechanical reset point coordinates for X-axis (change to 350 for 350 models)
position_max : 350       ## X-axis maximum travel - software limit (change to 350 for 350 models)
homing_speed : 50           # Reset speed maximum 100
homing_retract_dist : 5     # Setback distance after the first trigger of the reset switch
homing_positive_dir : true  # Direction of reset (generally no change required)

[tmc2240 stepper_x]
cs_pin : PC4
spi_software_sclk_pin : PA5
spi_software_mosi_pin : PA7
spi_software_miso_pin : PA6
driver_TPFD : 0
run_current : 0.85

#####################################################################
##                   Y-axis on MOTOR_1(A Motor)
#####################################################################

[stepper_y]
step_pin : PG0              # Y-axis motor pulse pin setting
dir_pin : !PG1               # Y-axis motor direction pin setting
enable_pin : !PF15          # Y-axis motor enable pin setting
microsteps : 32             # Motor microsteps Setting
rotation_distance : 40      # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
full_steps_per_rotation : 200   # Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)
endstop_pin : PG9           # Limit switch PIN pin setting（Y-）
position_min : 0            # X-axis minimum travel - software limit
position_endstop : 350      # Mechanical reset point coordinates for Y-axis (change to 350 for 350 models)
position_max : 350          # Y-axis maximum travel - software limit (change to 350 for 350 models)
homing_speed : 50           # Reset speed maximum 100
homing_retract_dist : 5     # Setback distance after the first trigger of the reset switch
homing_positive_dir : true  # Direction of reset (generally no change required)

[tmc2240 stepper_y]
cs_pin : PD11
spi_software_sclk_pin : PA5
spi_software_mosi_pin : PA7
spi_software_miso_pin : PA6
driver_TPFD : 0
run_current : 0.85

####################################################################################
#   z1 -------------- z2
#   |                 |
#   |                 |
#   |                 |
#   |                 |
#  z0---   display ---z3
#####################################################################
##                  Z0-axis
#####################################################################

##		Z0-axis on MOTOR2_1(left front)
[stepper_z]
step_pin : PF11    		   # Z-axis motor pulse pin
dir_pin : !PG3               # Z-axis motor direction pin setting
enable_pin : !PG5           # Z-axis motor enable pin setting
rotation_distance : 40      # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
gear_ratio : 80:16          # reduction ratio
microsteps : 16             # microsteps
endstop_pin : probe:z_virtual_endstop #PG10          # Limit switch interface
##  position_endstop is the distance of the Z limit pin trigger point from the print surface.
##  Positive value = above the termination point of the platform，
##  Negative value = termination point below the plateau.
##  Increasing the value of position_ endstop will bring the nozzle closer to the bed.
##  After running Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the end of the CFG configuration.
##position_endstop: 0.5      # Modified as per actual
position_max : 340       # Maximum Z-axis print height   350mm=340
position_min : -5           # Soft Limit Minimum Stroke
homing_speed : 10           # Reset speed - maximum 20
second_homing_speed : 3     # Secondary reset speed - maximum 10
homing_retract_dist : 3     # Retreat distance

#--------------------------------------------------------------------
[tmc2209 stepper_z]        # TMC2209
uart_pin : PC6              # drive communications port
interpolate : true          # Whether to enable 256 microstep interpolation
run_current : 0.8           # Motor running current value(mA)
sense_resistor : 0.110      # Do not change the drive sampling resistor
stealthchop_threshold : 200 # Mute threshold

#--------------------------------------------------------------------#
##		Z1-axis on MOTOR3(left rear)
[stepper_z1]
step_pin : PG4              # Z1-axis motor pulse pin
dir_pin : PC1              # Z1-axis motor direction pin setting
enable_pin : !PA0           # Z1-axis motor enable pin setting
rotation_distance : 40      # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
gear_ratio : 80:16          # reduction ratio
microsteps : 16             # microsteps

#--------------------------------------------------------------------
[tmc2209 stepper_z1]       # TMC2209
uart_pin : PC7              # drive communications port
interpolate : true          # Whether to enable 256 microstep interpolation
run_current : 0.8           # Motor running current value(mA)
sense_resistor : 0.110      # Do not change the drive sampling resistor
stealthchop_threshold : 200 # Mute threshold

#--------------------------------------------------------------------#
##		Z2-axis on MOTOR4(right-rear)
[stepper_z2]
step_pin : PF9              # Z2-axis motor pulse pin
dir_pin : !PF10              # Z2-axis motor direction pin setting
enable_pin : !PG2           # Z2-axis motor enable pin setting
rotation_distance : 40      # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
gear_ratio : 80:16          # reduction ratio
microsteps : 16             # microsteps

#--------------------------------------------------------------------
[tmc2209 stepper_z2]       # TMC2209
uart_pin : PF2              # drive communications port
interpolate : true          # Whether to enable 256 microstep interpolation
run_current : 0.8           # Motor running current value(mA)
sense_resistor : 0.110      # Do not change the drive sampling resistor
stealthchop_threshold : 200 # Mute threshold

#--------------------------------------------------------------------#
##		Z3-axis on MOTOR5(right-front)
[stepper_z3]
step_pin : PC13             # Z3-axis motor pulse pin
dir_pin : PF0              # Z3-axis motor direction pin setting
enable_pin : !PF1           # Z3-axis motor enable pin setting
rotation_distance : 40      # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
gear_ratio : 80:16          # reduction ratio
microsteps : 16             # microsteps

#--------------------------------------------------------------------
[tmc2209 stepper_z3]       # TMC2209
uart_pin : PE4              # drive communications port
interpolate : true          # Whether to enable 256 microstep interpolation
run_current : 0.8           # Motor running current value(mA)
sense_resistor : 0.110      # Do not change the drive sampling resistor
stealthchop_threshold : 200 # Mute threshold

#####################################################################
##                  Extruder motor
#####################################################################

[extruder]
step_pin : EBBCan:gpio18
dir_pin : !EBBCan:gpio19
enable_pin : !EBBCan:gpio17
full_steps_per_rotation : 200  # Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)
microsteps : 16
gear_ratio : 50:10
nozzle_diameter : 0.600
filament_diameter : 1.750
heater_pin : EBBCan:gpio7
#sensor_type: EPCOS 100K B57560G104F
#sensor_pin: EBBCan:gpio27
control : pid
min_temp : 0
max_temp : 300
min_extrude_temp : 180                # Minimum extrusion temperature (Safety)
pressure_advance : 0.05                # Propulsion pressure - try to keep pressure below 1.0
pressure_advance_smooth_time : 0.040   # Smooth advance time - default value is 0.040
##Nozzle Temperature PID Calibration Command:  "PID_CALIBRATE HEATER=extruder TARGET=245"
max_extrude_cross_section: 5
sensor_type : MAX31865
sensor_pin : EBBCan:gpio9
spi_software_sclk_pin : EBBCan:gpio10
spi_software_mosi_pin : EBBCan:gpio8
spi_software_miso_pin : EBBCan:gpio11
rtd_nominal_r : 100
rtd_reference_r : 430
rtd_num_of_wires : 2

[tmc2209 extruder]
uart_pin : EBBCan:gpio20
run_current : 0.550
stealthchop_threshold : 0 # SpreadCycle only for extruder

#--------------------------------------------------------------------
[verify_heater extruder]   # Heating Block Temperature Tolerance Configuration
max_error : 120             # maximum error
check_gain_time : 30         # tolerance time (balanced protection)
hysteresis : 10             # tolerance temperature
heating_gain : 2            # Heating Gain

#####################################################################
##                  Heater_bed
#####################################################################

[heater_bed]
heater_pin : PA3              # (BE0)
sensor_pin : PF3              # sensor interface(TB)
sensor_type : ATC Semitec 104GT-2	 #ATC Semitec 104GT-2
control : pid                 ##heater_bed Temperature PID Calibration Command:  "PID_CALIBRATE HEATER=heater_bed TARGET=100"
min_temp : 0
max_temp : 120
max_power : 1.0

#####################################################################
#                  FAN
#####################################################################

[fan]
pin : EBBCan:gpio13
kick_start_time : 0.5
off_below : 0.10

[heater_fan hotend_fan]
pin : EBBCan:gpio14
heater : extruder
heater_temp : 50.0

#[fan_generic 4W_FAN0]
#pin: EBBCan:gpio15
#tachometer_pin: EBBCan:gpio12
#tachometer_ppr: 1

#[heater_fan Nevermore]
#pin : PA8
#max_power : 1.0
#shutdown_speed : 1.0
#kick_start_time : 5.0
#heater : extruder
#heater_temp : 200
#fan_speed : 1.0

#--------------------------------------------------------------------

[temperature_fan  BTT_Pi_fan]  # Skirt fan 1
pin : PE5                    # FAN-2
shutdown_speed : 0.0          # Closing speed (Please do not change)
kick_start_time : 0.5         # start-up time (Please do not change)

control: watermark
max_power : 0.6               # Fan speed
min_speed : 0.2
sensor_type: temperature_host
min_temp: 0
max_temp: 85
target_temp: 50

#--------------------------------------------------------------------

[temperature_fan  MCU_fan] # Skirt fan 2
pin : PD12                    # FAN-3
shutdown_speed : 0.0          # Closing speed (Please do not change)
kick_start_time : 0.5         # start-up time (Please do not change)

control: watermark
max_speed : 0.6               # Fan speed
min_speed : 0.2
sensor_type: temperature_mcu
min_temp: 0
max_temp: 85
target_temp: 45

#--------------------------------------------------------------------

#[heater_fan exhaust_fan]     # exhaust_fan
#pin: PD13                    # FAN-4
#shutdown_speed: 0.0          # Closing speed (Please do not change)
#kick_start_time: 5.0         # start-up time (Please do not change)
#heater: heater_bed           # Related equipment: heater_bed
#heater_temp: 60              # How many degrees does the heat bed reach to activate the fan
#fan_speed: 1.0               # Fan speed

#--------------------------------------------------------------------

#[heater_fan hotend_fan]      # Hotend Fan
#pin: PD14                     # FAN-0
#max_power: 1.0               # Maximum speed
#kick_start_time: 0.5         # start-up time (Please do not change)
#heater: extruder             # Related equipment: extruder
#heater_temp: 50              # How many degrees does it reach to activate the fan
#fan_speed: 1.0               # Fan speed


#####################################################################
##                     Model and acceleration
#####################################################################

[printer]
kinematics : corexy           # Printer type：corexy
max_velocity : 300            # Maximum speed (max. 300)
max_accel : 5000              # Maximum acceleration (max. 4000)
max_z_velocity : 15           # Z-axis maximum speed
max_z_accel : 350             # Z-axis maximum acceleration
square_corner_velocity : 5.0  # Square corner speed

#####################################################################
# 	                   Bed Grid Calibration
#####################################################################

[bed_mesh]
speed : 80                    # Calibration speed
horizontal_move_z : 10        # Z-axis movement speed
mesh_min : 25, 25             # Minimum calibration point coordinates x, y
mesh_max : 325, 325           # Maximum calibration point coordinates x, y
probe_count : 7,7             # Number of sampling points (7X7 is 49 points)
mesh_pps : 2,2                # Number of supplementary sampling points
algorithm : bicubic           # algorithmic model
bicubic_tension : 0.2         # Algorithmic interpolation don't move

#####################################################################
#                            RGB-LEDlight
#####################################################################

#[neopixel LEDlight]
#pin: PB0                     # signal interface
#chain_count: 18              # Number of lamp beads
#color_order: GRB             # colour sequence
#initial_RED: 0.2             # Initial red brightness
#initial_GREEN: 0.2           # Initial green brightness
#initial_BLUE: 0.2            # Initial blue brightness

[neopixel sb_leds]
pin: EBBCan:gpio16
#   The pin connected to the neopixel. This parameter must be provided.
chain_count: 3
#   The number of Neopixel chips that are "daisy chained" to the
#   provided pin. The default is 1 (which indicates only a single
#   Neopixel is connected to the pin).
color_order: GRB
#   Set the pixel order required by the LED hardware. Options are GRB,
#   RGB, GRBW, or RGBW. The default is GRB.
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 1.0
initial_WHITE: 0.0
#   Sets the initial LED color of the Neopixel. Each value should be
#   between 0.0 and 1.0. The WHITE option is only available on RGBW
#   LEDs. The default for each color is 0.#

# Most configuration for the macros can be done by modifying the variables in the _sb_vars macro
# at the start of this file.

##########
# MACROS #
##########

# The following status macros are available (these go inside of your macros):
#
#    STATUS_READY
#    STATUS_OFF
#    STATUS_BUSY
#    STATUS_HEATING
#    STATUS_LEVELING
#    STATUS_HOMING
#    STATUS_CLEANING
#    STATUS_MESHING
#    STATUS_CALIBRATING_Z
#
# With additional macros for basic control:
#
#    SET_NOZZLE_LEDS_ON
#    SET_LOGO_LEDS_OFF
#    SET_NOZZLE_LEDS_OFF
#
# Contributed by Voron discord users wile.e, Tetsunosuke, and etherwalker


[gcode_macro _sb_vars]
# User settings for the StealthBurner status leds. You can change the status colors and led
# configurations for the logo and nozzle here.
variable_colors: {
                 'logo': { # Colors for logo states
                 'busy': {'r': 0.4, 'g': 0.0, 'b': 0.0, 'w': 0.0},
                 'cleaning': {'r': 0.0, 'g': 0.02, 'b': 0.5, 'w': 0.0},
                 'calibrating_z': {'r': 0.8, 'g': 0., 'b': 0.35, 'w': 0.0},
                 'heating': {'r': 0.3, 'g': 0.18, 'b': 0.0, 'w': 0.0},
                 'homing': {'r': 0.0, 'g': 0.6, 'b': 0.2, 'w': 0.0},
                 'leveling': {'r': 0.5, 'g': 0.1, 'b': 0.4, 'w': 0.0},
                 'meshing': {'r': 0.2, 'g': 1.0, 'b': 0.0, 'w': 0.0},
                 'off': {'r': 0.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},
                 'printing': {'r': 1.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},
                 'standby': {'r': 0.01, 'g': 0.01, 'b': 0.01, 'w': 0.1},
                 },
                 'nozzle': { # Colors for nozzle states
                 'heating': {'r': 0.8, 'g': 0.35, 'b': 0.0, 'w':0.0},
                 'off': {'r': 0.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},
                 'on': {'r': 0.8, 'g': 0.8, 'b': 0.8, 'w':1.0},
                 'standby': {'r': 0.6, 'g': 0.0, 'b': 0.0, 'w':0.0},
                 },
                 'thermal': {
                 'hot': {'r': 1.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},
                 'cold': {'r': 0.3, 'g': 0.0, 'b': 0.3, 'w': 0.0}
                 }
                 }
variable_logo_led_name:         "sb_leds"
# The name of the addressable LED chain that contains the logo LED(s)
variable_logo_idx:              "1"
# A comma-separated list of indexes LEDs in the logo
variable_nozzle_led_name:       "sb_leds"
# The name of the addressable LED chain that contains the nozzle LED(s). This will
# typically be the same LED chain as the logo.
variable_nozzle_idx:            "2,3"
# A comma-separated list of indexes of LEDs in the nozzle
gcode:
# This section is required.  Do Not Delete.


[gcode_macro _set_sb_leds]
gcode:
    {% set red = params.RED|default(0)|float %}
    {% set green = params.GREEN|default(0)|float %}
    {% set blue = params.BLUE|default(0)|float %}
    {% set white = params.WHITE|default(0)|float %}
    {% set led = params.LED|string %}
    {% set idx = (params.IDX|string).split(',') %}
    {% set transmit_last = params.TRANSMIT|default(1) %}

    {% for led_index in idx %}
    {% set transmit=transmit_last if loop.last else 0 %}
    set_led led={led} red={red} green={green} blue={blue} white={white} index={led_index} transmit={transmit}
    {% endfor %}

[gcode_macro _set_sb_leds_by_name]
gcode:
    {% set leds_name = params.LEDS %}
    {% set color_name = params.COLOR %}
    {% set color = printer["gcode_macro _sb_vars"].colors[leds_name][color_name] %}
    {% set led = printer["gcode_macro _sb_vars"][leds_name + "_led_name"] %}
    {% set idx = printer["gcode_macro _sb_vars"][leds_name + "_idx"] %}
    {% set transmit = params.TRANSMIT|default(1) %}

    _set_sb_leds led={led} red={color.r} green={color.g} blue={color.b} white={color.w} idx="{idx}" transmit={transmit}

[gcode_macro _set_logo_leds]
gcode:
    {% set red = params.RED|default(0)|float %}
    {% set green = params.GREEN|default(0)|float %}
    {% set blue = params.BLUE|default(0)|float %}
    {% set white = params.WHITE|default(0)|float %}
    {% set led = printer["gcode_macro _sb_vars"].logo_led_name %}
    {% set idx = printer["gcode_macro _sb_vars"].logo_idx %}
    {% set transmit=params.TRANSMIT|default(1) %}

    _set_sb_leds led={led} red={red} green={green} blue={blue} white={white} idx="{idx}" transmit={transmit}

[gcode_macro _set_nozzle_leds]
gcode:
    {% set red = params.RED|default(0)|float %}
    {% set green = params.GREEN|default(0)|float %}
    {% set blue = params.BLUE|default(0)|float %}
    {% set white = params.WHITE|default(0)|float %}
    {% set led = printer["gcode_macro _sb_vars"].nozzle_led_name %}
    {% set idx = printer["gcode_macro _sb_vars"].nozzle_idx %}
    {% set transmit=params.TRANSMIT|default(1) %}

    _set_sb_leds led={led} red={red} green={green} blue={blue} white={white} idx="{idx}" transmit={transmit}

[gcode_macro set_logo_leds_off]
gcode:
    {% set transmit=params.TRANSMIT|default(1) %}
    _set_logo_leds red=0 blue=0 green=0 white=0 transmit={transmit}

[gcode_macro set_nozzle_leds_on]
gcode:
    {% set transmit=params.TRANSMIT|default(1) %}
    _set_sb_leds_by_name leds="nozzle" color="on" transmit={transmit}

[gcode_macro set_nozzle_leds_off]
gcode:
    {% set transmit=params.TRANSMIT|default(1) %}
    _set_sb_leds_by_name leds="nozzle" color="off" transmit={transmit}

[gcode_macro status_off]
gcode:
    set_logo_leds_off transmit=0
    set_nozzle_leds_off

[gcode_macro status_ready]
gcode:
    _set_sb_leds_by_name leds="logo" color="standby" transmit=0
    _set_sb_leds_by_name leds="nozzle" color="standby" transmit=1

[gcode_macro status_busy]
gcode:
    _set_sb_leds_by_name leds="logo" color="busy" transmit=0
    set_nozzle_leds_on

[gcode_macro status_heating]
gcode:
    _set_sb_leds_by_name leds="logo" color="heating" transmit=0
    _set_sb_leds_by_name leds="nozzle" color="heating" transmit=1

[gcode_macro status_leveling]
gcode:
    _set_sb_leds_by_name leds="logo" color="leveling" transmit=0
    set_nozzle_leds_on

[gcode_macro status_homing]
gcode:
    _set_sb_leds_by_name leds="logo" color="homing" transmit=0
    set_nozzle_leds_on

[gcode_macro status_cleaning]
gcode:
    _set_sb_leds_by_name leds="logo" color="cleaning" transmit=0
    set_nozzle_leds_on

[gcode_macro status_meshing]
gcode:
    _set_sb_leds_by_name leds="logo" color="meshing" transmit=0
    set_nozzle_leds_on

[gcode_macro status_calibrating_z]
gcode:
    _set_sb_leds_by_name leds="logo" color="calibrating_z" transmit=0
    set_nozzle_leds_on

[gcode_macro status_printing]
gcode:
    _set_sb_leds_by_name leds="logo" color="printing" transmit=0
    set_nozzle_leds_on

#####################################################################
#                          Idle off hot bed
#####################################################################

[idle_timeout]
gcode:
    _DEMON_IDLE_TIMEOUT
timeout : 3600                # The hot bed is switched off if the idle time exceeds 30 minutes

#####################################################################
#                        Homing and Gantry Adjustment
#####################################################################

[homing_override]
axes : z
set_position_z : 0
gcode :
    G90
    G0 Z5 F1800
    G28 X Y
    G0 X175 Y175 F7200    #350mm
    G28 Z
    G0 Z10  F1800
    G0 X175 Y175 Z30 F1800

#####################################################################

## NPN and PNP proximity switch types can be set by jumper  24V
[probe]
pin : !EBBCan:gpio22
x_offset : 0     			 # X-axis - sensor offset relative to the nozzle
y_offset : 0                  # Y-axis - Voron Tap (nozzle is probe)
# z_offset : 0                  # Z-axis - sensor offset relative to the nozzle
#You'll need to manually calibrate the probe's Z offset by using "PROBE_CALIBRATE"
speed : 10.0                  # Levelling speed
samples : 3                   # sampling frequency
samples_result : median       # Value type (default median)
sample_retract_dist : 3.0     # Levelling retraction distance
samples_tolerance : 0.01      # Sampling tolerance (note that too small a value may result in increased sampling)
samples_tolerance_retries : 3 # Number of out-of-tolerance retries

##-----------Reduce nozzle temperature for gantry levelling-------##
activate_gcode =
    {% set PROBE_TEMP = 150 %}                     ## Setting the print head temperature 150
    {% set MAX_TEMP = PROBE_TEMP + 5 %}            ## Limit temperature +5 degrees
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}              ## Checking the temperature
    { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
    M109 S{ PROBE_TEMP }
    {% else %}

    {% if ACTUAL_TEMP > MAX_TEMP %}                ## Judging the actual temperature
    { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
    {% endif %}
    {% endif %}

####################################################################################
#	                         Gantry levelling
####################################################################################

[quad_gantry_level]
gantry_corners :
    -60,-10
    410,420
points :
    50,25
    50,275
    300,275
    300,25

#--------------------------------------------------------------------
speed : 150                          # Levelling speed
horizontal_move_z : 10               # Z-axis starting height
retries : 5                          # Number of out-of-tolerance retries
retry_tolerance : 0.01               # Sampling tolerance
max_adjust : 10                      # Maximum adjustment stroke for levelling

[board_pins]
aliases :
# EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,       # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

# EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,         # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=PC5

####################################################################################
#	                         Resonance testing
####################################################################################

[adxl345]
cs_pin : EBBCan:gpio1
spi_software_sclk_pin : EBBCan:gpio2
spi_software_mosi_pin : EBBCan:gpio0
spi_software_miso_pin : EBBCan:gpio3
axes_map : z,-y,x

[resonance_tester]
probe_points : 175, 175, 20
accel_chip : adxl345

[save_variables]
filename = ~/printer_data/config/demon_vars.cfg

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[display_status]

[pause_resume]

[respond]

[exclude_object]

[force_move]
enable_force_move: True


[firmware_retraction]
retract_length: 0.8
retract_speed: 30
unretract_extra_length: 0.0
unretract_speed: 30
