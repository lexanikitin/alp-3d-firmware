# ==============================================================================
# Alpaca 3D Farm — KlipperScreen Fleet Interface (Host: Ender C)
# ==============================================================================
# Единый сенсорный интерфейс управления парком Creality Ender-3 S1 Pro.
# Конфигурация версионируется в репозитории alp-3d-firmware.
# Прямые правки на хосте запрещены (Fleet Golden Rules).
# ==============================================================================

[main]
# Внешний вид и поведение
theme: material-dark
screen_blanking: 300
font_size: small
confirm_estop: True
side_macro_shortcut: True
show_cursor: False
use_dpms: True

# ------------------------------------------------------------------------------
# 1. Локальный станок (Ender C) — ВСЕГДА ПЕРВЫЙ
# Гарантирует доступность локального управления даже при полном падении сети
# ------------------------------------------------------------------------------
[printer Ender C (0.8mm)]
moonraker_host: 127.0.0.1
moonraker_port: 7125
titlebar_items: MCU, BPi
titlebar_name_type: short

# ------------------------------------------------------------------------------
# 2. Удаленные станки фермы (Ender A и Ender B в сети 10.10.10.x)
# ------------------------------------------------------------------------------
[printer Ender A (0.4mm)]
moonraker_host: 10.10.10.55
moonraker_port: 7125
titlebar_items: MCU, BPi
titlebar_name_type: short

[printer Ender B (0.4mm)]
moonraker_host: 10.10.10.56
moonraker_port: 7125
titlebar_items: MCU, BPi
titlebar_name_type: short
